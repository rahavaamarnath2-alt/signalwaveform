<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c32">
<title>Signal Waveform Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #172033;
}

header {
    background: #101c32;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0 0 8px;
    font-size: 27px;
    line-height: 1.3;
}

header p {
    margin: 0;
    color: #b8c8df;
    line-height: 1.5;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 16px;
}

.card {
    min-width: 0;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #17203312;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
}

.controls > div {
    min-width: 0;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
    background: white;
    color: #172033;
}

input:focus, select:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

button {
    min-height: 42px;
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    touch-action: manipulation;
}

.primary {
    background: #2563eb;
    color: white;
}

.green {
    background: #15803d;
    color: white;
}

.red {
    background: #dc2626;
    color: white;
}

.gray {
    background: #e2e8f0;
    color: #172033;
}

button:hover {
    filter: brightness(0.94);
}

button:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}

.status {
    margin-top: 14px;
    color: #475569;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.error {
    color: #dc2626;
}

.scope {
    width: 100%;
    min-width: 0;
    background: #101a27;
    padding: 12px;
    border-radius: 10px;
}

canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 420px;
}

.readings {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

.reading {
    min-width: 0;
    padding: 15px;
    border-radius: 8px;
    background: #f1f5f9;
}

.reading span {
    display: block;
    color: #64748b;
    font-size: 13px;
    margin-bottom: 7px;
}

.reading strong {
    font-size: 19px;
    overflow-wrap: anywhere;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
    font-size: 13px;
    line-height: 1.5;
}

/* Tablets and smaller laptops */
@media (max-width: 900px) {
    .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .readings {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    canvas {
        height: 340px;
    }
}

/* Mobile phones */
@media (max-width: 600px) {
    header {
        padding: 18px 12px;
    }

    header h1 {
        font-size: clamp(19px, 5vw, 23px);
    }

    header p {
        font-size: 13px;
    }

    .container {
        margin: 14px auto;
        padding: 0 10px;
    }

    .card {
        padding: 14px;
        margin-bottom: 14px;
        border-radius: 10px;
    }

    h2 {
        font-size: 18px;
    }

    .controls {
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
    }

    input, select {
        font-size: 16px;
        padding: 12px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .buttons button {
        width: 100%;
        padding: 11px 6px;
        font-size: 13px;
    }

    .readings {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .reading {
        padding: 11px;
    }

    .reading strong {
        font-size: 16px;
    }

    .scope {
        padding: 5px;
        border-radius: 8px;
    }

    canvas {
        height: 260px;
    }

    footer {
        padding: 16px 10px;
        font-size: 12px;
    }
}

/* Very narrow phones */
@media (max-width: 360px) {
    .container {
        padding: 0 7px;
    }

    .card {
        padding: 10px;
    }

    .scope {
        padding: 3px;
    }

    canvas {
        height: 230px;
    }

    .reading strong {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Basic Signal Waveform Generator</h1>
    <p>Interactive CRO-Style Signal Simulator</p>
</header>

<main class="container">

    <section class="card">
        <h2>Signal Settings</h2>

        <div class="controls">
            <div>
                <label for="waveType">Waveform Type</label>
                <select id="waveType">
                    <option value="sine">Sine</option>
                    <option value="square">Square</option>
                    <option value="triangle">Triangle</option>
                    <option value="sawtooth">Sawtooth</option>
                </select>
            </div>

            <div>
                <label for="frequency">Frequency (Hz / k / M)</label>
                <input id="frequency" value="1k" placeholder="Example: 1k">
            </div>

            <div>
                <label for="amplitude">Amplitude (V)</label>
                <input id="amplitude" type="number" min="0.01"
                       max="50" step="any" value="5">
            </div>

            <div>
                <label for="phase">Phase (degrees)</label>
                <input id="phase" type="number" step="any" value="0">
            </div>

            <div>
                <label for="timeScale">Time Scale (ms/div)</label>
                <input id="timeScale" type="number" min="0.000001"
                       step="any" value="0.5">
            </div>
        </div>

        <div class="buttons">
            <button class="primary" id="update">Update Signal</button>
            <button class="green" id="start">Start</button>
            <button class="red" id="stop">Stop</button>
            <button class="gray" id="reset">Reset</button>
        </div>

        <div class="status" id="status" aria-live="polite">
            Signal running.
        </div>
    </section>

    <section class="card">
        <h2>CRO Display</h2>
        <div class="scope">
            <canvas id="scope" role="img"
                    aria-label="Animated signal waveform display"></canvas>
        </div>
    </section>

    <section class="card">
        <h2>Signal Readings</h2>

        <div class="readings">
            <div class="reading">
                <span>Frequency</span>
                <strong id="frequencyRead">1 kHz</strong>
            </div>

            <div class="reading">
                <span>Amplitude</span>
                <strong id="amplitudeRead">5 V</strong>
            </div>

            <div class="reading">
                <span>Period</span>
                <strong id="periodRead">1 ms</strong>
            </div>

            <div class="reading">
                <span>Total Time</span>
                <strong id="totalTimeRead">5 ms</strong>
            </div>
        </div>
    </section>

</main>

<footer>
    Educational waveform simulation — not a physical measuring instrument.
</footer>

<script>
const canvas = document.getElementById("scope");
const ctx = canvas.getContext("2d");

const waveType = document.getElementById("waveType");
const frequencyInput = document.getElementById("frequency");
const amplitudeInput = document.getElementById("amplitude");
const phaseInput = document.getElementById("phase");
const timeScaleInput = document.getElementById("timeScale");
const statusText = document.getElementById("status");

let frequency = 1000;
let amplitude = 5;
let phase = 0;
let timeScale = 0.5;
let position = 0;
let running = true;
let lastFrame = 0;

function parseFrequency(text) {
    let value = text.trim().toLowerCase();
    let multiplier = 1;

    if (value.endsWith("k")) {
        multiplier = 1000;
        value = value.slice(0, -1);
    } else if (value.endsWith("m")) {
        multiplier = 1000000;
        value = value.slice(0, -1);
    }

    const result = Number(value) * multiplier;

    if (!Number.isFinite(result) || result <= 0 ||
        result > 1000000000) {
        throw new Error("Enter a valid positive frequency up to 1 GHz.");
    }

    return result;
}

function formatFrequency(value) {
    if (value >= 1000000) {
        return (value / 1000000).toLocaleString(
            "en-US", { maximumFractionDigits: 4 }
        ) + " MHz";
    }

    if (value >= 1000) {
        return (value / 1000).toLocaleString(
            "en-US", { maximumFractionDigits: 4 }
        ) + " kHz";
    }

    return value.toLocaleString(
        "en-US", { maximumFractionDigits: 4 }
    ) + " Hz";
}

function formatTime(value) {
    return Number(value.toPrecision(5)) + " ms";
}

function updateSignal() {
    try {
        const newFrequency = parseFrequency(frequencyInput.value);
        const newAmplitude = Number(amplitudeInput.value);
        const newPhase = Number(phaseInput.value);
        const newTimeScale = Number(timeScaleInput.value);

        if (!Number.isFinite(newAmplitude) ||
            newAmplitude <= 0 || newAmplitude > 50) {
            throw new Error("Amplitude must be greater than 0 and at most 50 V.");
        }

        if (!Number.isFinite(newPhase)) {
            throw new Error("Enter a valid phase angle.");
        }

        if (!Number.isFinite(newTimeScale) ||
            newTimeScale <= 0 || newTimeScale > 1000000) {
            throw new Error("Enter a valid positive time scale.");
        }

        frequency = newFrequency;
        amplitude = newAmplitude;
        phase = newPhase;
        timeScale = newTimeScale;
        position = 0;

        document.getElementById("frequencyRead").textContent =
            formatFrequency(frequency);

        document.getElementById("amplitudeRead").textContent =
            amplitude + " V";

        document.getElementById("periodRead").textContent =
            formatTime(1000 / frequency);

        document.getElementById("totalTimeRead").textContent =
            formatTime(timeScale * 10);

        statusText.textContent = "Signal updated successfully.";
        statusText.className = "status";

        draw();
    } catch (error) {
        statusText.textContent = error.message;
        statusText.className = "status error";
    }
}

function getWaveValue(cycle) {
    cycle = ((cycle % 1) + 1) % 1;

    switch (waveType.value) {
        case "square":
            return cycle < 0.5 ? amplitude : -amplitude;

        case "triangle":
            return amplitude * (1 - 4 * Math.abs(cycle - 0.5));

        case "sawtooth":
            return amplitude * (2 * cycle - 1);

        default:
            return amplitude * Math.sin(2 * Math.PI * cycle);
    }
}

function draw() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    const dpr = window.devicePixelRatio || 1;
    const pixelWidth = Math.round(rect.width * dpr);
    const pixelHeight = Math.round(rect.height * dpr);

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const w = rect.width;
    const h = rect.height;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#101a27";
    ctx.fillRect(0, 0, w, h);

    const left = w < 360 ? 43 : 55;
    const right = w - 12;
    const top = 20;
    const bottom = h - 45;

    const width = right - left;
    const height = bottom - top;

    if (width <= 0 || height <= 0) return;

    ctx.strokeStyle = "#344456";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 10; i++) {
        const x = left + i * width / 10;
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x, bottom);
        ctx.stroke();
    }

    for (let i = 0; i <= 8; i++) {
        const y = top + i * height / 8;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
    }

    ctx.strokeStyle = "#9fb2c7";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(left, top, width, height);

    const maxVoltage = Math.min(
        50, Math.max(5, Math.ceil(amplitude / 5) * 5)
    );

    ctx.fillStyle = "#cbd5e1";
    ctx.font = w < 360 ? "9px Arial" : "11px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    for (let i = 0; i <= 8; i++) {
        const voltage = maxVoltage - i * maxVoltage / 4;
        const y = top + i * height / 8;
        ctx.fillText(voltage.toFixed(1) + "V", left - 5, y);
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";

    for (let i = 0; i <= 10; i++) {
        const x = left + i * width / 10;
        const time = i * timeScale;

        ctx.fillText(
            Number(time.toPrecision(5)).toString(),
            x,
            bottom + 7
        );
    }

    ctx.fillStyle = "#e2e8f0";
    ctx.font = w < 360 ? "10px Arial" : "12px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
        "TIME (ms) — " + timeScale + " ms/div",
        left + width / 2,
        h - 12
    );

    ctx.save();
    ctx.beginPath();
    ctx.rect(left, top, width, height);
    ctx.clip();

    ctx.strokeStyle = "#32e6a1";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.beginPath();

    const totalTimeSeconds = timeScale * 10 / 1000;
    const visibleCycles = Math.min(
        frequency * totalTimeSeconds, 2000
    );
    const phaseCycles = phase / 360;

    for (let px = 0; px <= width; px++) {
        const fraction = px / width;
        const cycle = visibleCycles * fraction + position + phaseCycles;
        const value = getWaveValue(cycle);
        const x = left + px;
        const y = top + height / 2
                - (value / maxVoltage) * (height / 2);

        if (px === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.stroke();
    ctx.restore();
}

function animate(timestamp) {
    if (!lastFrame) lastFrame = timestamp;

    const elapsed = Math.min((timestamp - lastFrame) / 1000, 0.1);
    lastFrame = timestamp;

    if (running) {
        position = (position + elapsed * 0.5) % 1;
        draw();
    }

    requestAnimationFrame(animate);
}

document.getElementById("update").addEventListener("click", updateSignal);

document.getElementById("start").addEventListener("click", () => {
    running = true;
    statusText.textContent = "Signal running.";
    statusText.className = "status";
});

document.getElementById("stop").addEventListener("click", () => {
    running = false;
    statusText.textContent = "Signal paused.";
    statusText.className = "status";
});

document.getElementById("reset").addEventListener("click", () => {
    waveType.value = "sine";
    frequencyInput.value = "1k";
    amplitudeInput.value = "5";
    phaseInput.value = "0";
    timeScaleInput.value = "0.5";

    position = 0;
    running = true;
    updateSignal();
});

waveType.addEventListener("change", draw);
window.addEventListener("resize", draw);

if ("ResizeObserver" in window) {
    new ResizeObserver(draw).observe(canvas.parentElement);
}

updateSignal();
requestAnimationFrame(animate);
</script>

</body>
</html>
